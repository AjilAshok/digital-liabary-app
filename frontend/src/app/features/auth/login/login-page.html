<main class="login">
  <mat-card class="login__card" appearance="outlined">
    <div class="login__header">
      <mat-icon class="login__logo" aria-hidden="true">local_library</mat-icon>
      <h1>Digital Library</h1>
      <p>Sign in to manage the library collection</p>
    </div>

    @if (reason() === 'expired' && !errorMessage()) {
      <div class="login__notice" role="status">
        <mat-icon aria-hidden="true">info</mat-icon>
        <span>Your session has ended. Please sign in again.</span>
      </div>
    }

    @if (errorMessage(); as message) {
      <div class="login__error" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon>
        <span>{{ message }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="login__form">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          required
        />
        <mat-error><app-field-error [control]="form.controls.email" label="Email" /></mat-error>
      </mat-form-field>

      <app-password-field
        [control]="form.controls.password"
        label="Password"
        autocomplete="current-password"
      />

      <button mat-flat-button type="submit" class="login__submit" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="20" aria-label="Signing in" />
        } @else {
          Sign in
        }
      </button>
    </form>
  </mat-card>
</main>
